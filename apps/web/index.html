<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#dce0e8" />
    <meta name="description" content="Household meal planning: recipes, plan, grocery list, and supply." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Solving Food" />
    <link rel="icon" type="image/png" href="/icons/favicon-48.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/archivo-latin-wght.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/archivo-black-latin-400.woff2" as="font" type="font/woff2" crossorigin />
    <title>Solving Food</title>
    <script>
      // Apply the cached theme before first paint (no flash). Written by src/theme/apply.ts. Latte is the only
      // flavour (M9): a cache from another flavour is ignored (the CSS defaults are Latte + green).
      try {
        var t = JSON.parse(localStorage.getItem("sf.theme") || "null");
        if (t && t.vars && t.theme && t.theme.flavour === "latte") {
          var s = document.documentElement.style;
          for (var k in t.vars) s.setProperty("--" + k, t.vars[k]);
          document.documentElement.dataset.flavour = t.theme.flavour;
          document.querySelector('meta[name="theme-color"]').setAttribute("content", t.vars.pg);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
