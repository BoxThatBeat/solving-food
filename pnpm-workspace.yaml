packages:
  - apps/*
  - packages/*
  - functions
  - e2e
  - tests/*

# pnpm 11+ blocks dependency build scripts unless they're listed here.
allowBuilds:
  esbuild: true
  protobufjs: true
  "@firebase/util": true
  # Pulled in by @huggingface/transformers for Node only; the web app uses onnxruntime-web (M11).
  onnxruntime-node: false
