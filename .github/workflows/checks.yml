# Checks on every PR and on pushes to master (Planning/M0 §6, TECHNICAL_SPECS §13, §14.1).
#
# Everything runs inside the repo's Nix dev shell, the same toolchain as local development: Node, pnpm, the
# Firebase CLI, the JRE for the emulators, and Playwright's browsers (nixpkgs playwright-driver, pinned to the
# @playwright/test version in e2e/package.json). That keeps visual baselines identical between laptop and CI.
name: Checks

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"

jobs:
  static:
    name: Lint, types, unit, coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: pnpm store cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: nix develop -c pnpm install --frozen-lockfile
      - run: nix develop -c pnpm lint
      - run: nix develop -c pnpm typecheck
      - run: nix develop -c pnpm test
      - run: nix develop -c pnpm e2e:coverage
      - run: nix develop -c pnpm build

  emulator-tests:
    name: Rules and functions (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: Emulator binaries cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('flake.lock') }}
      - run: nix develop -c pnpm install --frozen-lockfile
      - run: nix develop -c pnpm test:rules
      - run: nix develop -c pnpm test:functions

  e2e:
    name: Playwright (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('flake.lock') }}
      - run: nix develop -c pnpm install --frozen-lockfile
      # Full project matrix on every run while the suite is small (M0); TECHNICAL_SPECS §14.1 narrows PRs to
      # @smoke + phone-ios + desktop-1080p once it grows.
      - run: nix develop -c pnpm e2e --shard=${{ matrix.shard }}/2
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14

  preview:
    name: Hosting preview channel
    # PRs from this repo only (forks have no access to the deploy secret).
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    needs: static
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: nix develop -c pnpm install --frozen-lockfile
      - run: nix develop -c pnpm --filter @solving-food/web build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOLVINGFOOD }}
          projectId: solvingfood
          expires: 7d
