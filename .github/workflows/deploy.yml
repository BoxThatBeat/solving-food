# Deploy to the `solvingfood` project after Checks pass on master (Planning/M0 §6).
# Auth: the service-account key in FIREBASE_SERVICE_ACCOUNT_SOLVINGFOOD (created by `firebase init hosting:github`;
# extra deploy roles granted 2026-10-09, see SETUP.md). SETUP.md "Deploy without a long-lived key" has the owner's steps
# to switch to Workload Identity Federation.
# Order (M22): rules and indexes, then functions, then hosting, so a new client never meets old functions or rules. No
# --force: a deploy that would delete a function stops instead of deleting it.
name: Deploy

on:
  workflow_run:
    workflows: [Checks]
    types: [completed]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: nix develop -c pnpm install --frozen-lockfile
      - run: nix develop -c pnpm build
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOLVINGFOOD }}
      - name: Deploy rules and indexes
        run: nix develop -c firebase deploy --only firestore,storage --project solvingfood --non-interactive
      - name: Deploy functions
        run: nix develop -c firebase deploy --only functions --project solvingfood --non-interactive
      - name: Deploy hosting
        run: nix develop -c firebase deploy --only hosting --project solvingfood --non-interactive
      - name: Smoke check
        run: |
          curl -fsS https://solvingfood.web.app/ | grep -q "<title>Solving Food</title>"
          curl -fsS https://us-east1-solvingfood.cloudfunctions.net/healthcheck | grep -q '"ok":true'
